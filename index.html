<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0b0d10">
  <title>Car Radio</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#0b0d10;--panel:#141920;--panel2:#1c232d;--line:#28313d;
    --text:#f2f4f7;--muted:#9aa4b2;--accent:#f2f2f2;--good:#78d394
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;height:100%;overflow:hidden}
  button,input{font:inherit}
  button{color:inherit}
  
  .app{
    width:100%;
    height:100vh;
    max-width:1024px;
    max-height:600px;
    margin:0 auto;
    padding:12px 18px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .main-layout {
    display: grid;
    grid-template-columns: 400px minmax(0, 1fr);
    gap: 16px;
    flex: 1;
    min-height: 0;
    min-width: 0;
  }

  .left-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-right: 1px solid var(--line);
    padding-right: 16px;
    min-height: 0;
    min-width: 0;
  }

  .player{display:grid;grid-template-columns:76px minmax(0, 1fr) auto;gap:12px;align-items:center;flex-shrink:0}
  .station-art-wrap{position:relative;width:76px;height:76px;flex-shrink:0}
  .station-art,.station-art-fallback{width:76px;height:76px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .station-art{object-fit:contain;display:none}
  .station-art-fallback{display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--muted)}
  .station-art-fallback::before,.big-picture-fallback::before,.card-logo-fallback-bg::before,.fav-logo-fallback-bg::before,.station-art-fallback::after,.big-picture-fallback::after,.card-logo-fallback-bg::after,.fav-logo-fallback-bg::after{content:none}
  
  .station-main{min-width:0;}
  .station-name{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .station-meta{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now-playing{font-size:11px;color:var(--good);margin-top:3px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  
  .icon-btn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:22px;cursor:pointer;flex-shrink:0}
  .icon-btn.active{font-size:20px}
  .player-actions{display:flex;gap:6px}
  .icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

  .big-picture{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:clamp(12px, 4vh, 38px) clamp(20px, 6vw, 64px);
    background:radial-gradient(ellipse at 50% 38%, #27313d 0%, #141920 42%, #080a0d 100%);
    text-align:center;
    isolation:isolate;
    overflow:hidden;
  }
  .big-picture.hidden{display:none}
  .big-picture-backdrop{position:absolute;inset:-28px;width:calc(100% + 56px);height:calc(100% + 56px);object-fit:cover;filter:blur(28px) brightness(.34) saturate(.8);opacity:.9;pointer-events:none;z-index:0}
  .big-picture::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(5,7,9,.38),rgba(5,7,9,.58));pointer-events:none}
  .big-picture-close{position:absolute;top:20px;right:20px;z-index:3}
  .big-picture-refresh{position:absolute;top:20px;right:76px;z-index:3}
  .big-picture-favorite{position:absolute;top:20px;right:132px;z-index:3}
  .big-picture-main{position:relative;z-index:2;flex:1;min-height:0;width:100%;max-width:1000px;display:grid;grid-template-columns:auto auto;grid-template-rows:minmax(0, 1fr) auto;justify-content:center;align-items:center;column-gap:clamp(20px, 4vw, 56px);row-gap:12px}
  .big-picture-art-wrap{justify-self:end;width:min(44vh, 32vw, 360px);height:min(44vh, 32vw, 360px);min-width:min(170px, 30vw);min-height:min(150px, 30vh);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:24px;background:var(--panel2);overflow:hidden;flex-shrink:1}
  .big-picture-art{width:100%;height:100%;object-fit:contain;padding:18px}
  .big-picture-fallback{display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-size:clamp(80px, 18vw, 150px);color:var(--muted)}
  .big-picture-info{width:fit-content;max-width:min(520px, 52vw);min-width:0;justify-self:start;text-align:left}
  .big-picture-name{display:-webkit-box;width:100%;max-width:100%;font-size:40px;font-weight:800;white-space:normal;overflow:hidden;overflow-wrap:anywhere;word-break:normal;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
  .big-picture-meta,.big-picture-status{margin-top:8px;color:var(--muted);font-size:14px}
  .big-picture-status{color:var(--good)}
  .big-picture-favorites{position:relative;z-index:2;width:100%;flex:0 0 auto;text-align:left;border-top:1px solid var(--line);padding-top:8px}
  .big-picture-favorites-title{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px}
  .big-picture-favorites .favorites-bar{display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;overflow-y:hidden;max-height:124px;flex:0 0 auto;padding:2px 2px 8px;align-content:initial;touch-action:pan-x;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .big-picture-favorites .fav-chip{width:108px;flex:0 0 108px;aspect-ratio:1;border-radius:10px;touch-action:pan-x}
  .big-picture-favorites .fav-logo-bg{padding:6px}
  .big-picture-favorites .fav-overlay{padding:6px 3px 3px}
  .big-picture-favorites .fav-name{font-size:9px}
  .big-picture-controls{grid-column:1 / -1;grid-row:2;display:flex;align-items:center;justify-content:center;gap:14px}
  .big-picture-controls .control-btn{width:58px;height:58px}
  .big-picture-controls .play-btn{width:76px;height:76px}
  .big-picture-controls svg{width:28px;height:28px;fill:var(--text)}
  .big-picture-controls .play-btn svg{width:34px;height:34px}

  .controls{display:flex;justify-content:center;align-items:center;gap:16px;flex-shrink:0;padding:4px 0;}
  .control-btn,.play-btn{border:1px solid var(--line);background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
  .control-btn{width:60px;height:60px;border-radius:16px;}
  .play-btn{width:76px;height:76px;border-radius:20px;background:var(--panel2);}
  
  .control-btn svg, .play-btn svg { width: 28px; height: 28px; fill: var(--text); }
  .play-btn svg { width: 34px; height: 34px; }
  .shuffle-btn svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .control-btn:active,.play-btn:active,.icon-btn:active,.tab:active,.filter-btn:active,.load-more-btn:active{transform:scale(.95)}

  .favorites-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    min-height: 0;
    min-width: 0;
  }
  .favorites-title { font-size: 12px; color: var(--muted); font-weight: 700; flex-shrink: 0; }
  
  .favorites-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 2px 4px 6px 2px;
    flex: 1;
    min-height: 0;
    align-content: flex-start;
    touch-action: pan-y;
  }
  
  .favorites-bar::-webkit-scrollbar { width: 6px; }
  .favorites-bar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .fav-chip {
    position: relative;
    width: calc((100% - 16px) / 3);
    aspect-ratio: 1;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel2);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    transition: border-color .2s, transform 0.15s ease, opacity 0.15s ease;
    flex-shrink: 0;
    touch-action: pan-y;
    user-select: none;
  }
  .fav-chip:hover { border-color: var(--muted); }
  .fav-chip.active { outline: 2px solid var(--accent); border-color: var(--accent); }
  .fav-chip.dragging { opacity: 0.4; transform: scale(0.95); border-style: dashed; }

  .fav-logo-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 8px;
    pointer-events: none;
  }

  .fav-logo-fallback-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel2);
    color: var(--muted);
    font-size: 26px;
    pointer-events: none;
  }

  .fav-overlay {
    position: relative;
    z-index: 2;
    background: linear-gradient(to top, rgba(10, 13, 16, 0.95) 60%, rgba(10, 13, 16, 0.7) 90%, transparent);
    padding: 8px 4px 4px 4px;
    width: 100%;
  }

  .fav-name {
    font-weight: 700;
    font-size: 10px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }

  .right-panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }

  .tabs{display:grid;grid-template-columns:repeat(4,1fr) 48px;gap:8px;padding-bottom:10px;flex-shrink:0}
  .tab{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 6px;cursor:pointer;text-align:center;font-size:14px;font-weight:700}
  .tab.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:800}

  .refresh-btn {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    background: var(--panel) !important;
    color: var(--text) !important;
    border: 1px solid var(--line) !important;
    border-radius: 12px !important;
    font-size: 18px !important;
    padding: 0 !important;
    cursor: pointer !important;
  }
  .refresh-btn:hover { background: var(--panel2) !important; }

  .search-panel{display:flex;gap:8px;margin-bottom:8px;flex-shrink:0}
  .search-panel input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 14px;outline:none;font-size:14px;min-width:0}
  .search-panel button{border:1px solid var(--line);background:var(--accent);color:#111;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer;font-size:14px;flex-shrink:0}
  
  .filter-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .filter-group-title { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
  .filter-options { display: flex; flex-wrap: wrap; gap: 6px; }
  #tagFilters{flex-wrap:nowrap;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:2px 2px 8px;touch-action:pan-x pan-y;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  #tagFilters .filter-btn{flex:0 0 auto;white-space:nowrap}
  #tagFilters::-webkit-scrollbar{height:6px}
  #tagFilters::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .filter-btn {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
  }
  .filter-btn.active { background: var(--accent); color: #111; font-weight: 700; border-color: var(--accent); }

  .hidden{display:none}

  .stations-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:4px 2px 8px;font-size:13px;flex-shrink:0}
  #resultCount{color:var(--muted);font-weight:400}

  .stations-container {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    min-width: 0;
    padding-bottom: 8px;
  }
  
  .stations{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:12px;min-width:0}
  
  .station-card{
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    border: 1px solid var(--line);
    background: var(--panel2);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    min-width: 0;
    position: relative;
    aspect-ratio: 1;
    transition: border-color .2s, transform 0.1s ease;
  }
  .station-card:hover{border-color: var(--muted)}
  .station-card:active{transform: scale(0.97)}
  .station-card.active{outline:2px solid var(--accent); border-color:var(--accent)}

  .card-logo-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 12px;
  }
  
  .card-logo-fallback-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel2);
    color: var(--muted);
    font-size: 42px;
  }
  .station-art-fallback,.big-picture-fallback,.card-logo-fallback-bg,.fav-logo-fallback-bg {
    background-image: url("https://raw.githubusercontent.com/SavenQ/radiodoautka/main/braklogo.png");
    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
  }

  .card-overlay {
    position: relative;
    z-index: 2;
    background: linear-gradient(to top, rgba(10, 13, 16, 0.95) 60%, rgba(10, 13, 16, 0.7) 90%, transparent);
    padding: 14px 10px 10px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .card-copy{min-width:0; flex: 1;}
  .card-name{
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 14px;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  .card-sub{
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-fav{
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(20, 25, 32, 0.85);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .card-fav:hover { background: var(--panel2); }
  .card-fav.active{background: var(--accent); color: #111; border-color: var(--accent);}
  
  .empty{padding:25px 10px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;grid-column:1/-1;font-size:14px}
  
  .load-more-btn {
    grid-column: 1 / -1;
    background: var(--panel);
    border: 1px dashed var(--line);
    color: var(--text);
    padding: 12px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    margin-top: 6px;
    font-size: 13px;
  }
  .load-more-btn:hover { background: var(--panel2); border-color: var(--muted); }
  
  .footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;padding-top:8px;flex-shrink:0;border-top:1px solid var(--line)}

  @media(max-width:850px){
    .app { padding: 8px 10px; }
    .main-layout { grid-template-columns: 1fr; gap: 10px; }
    .left-panel { border-right: none; border-bottom: 1px solid var(--line); padding-bottom: 8px; padding-right: 0; gap: 8px; }
    .stations { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .player {
      grid-template-columns: 60px minmax(0, 1fr) auto;
      gap: 8px;
    }
    .player-actions{gap:4px}
    .player-actions .icon-btn{width:38px;height:40px}
    .station-art-wrap, .station-art, .station-art-fallback {
      width: 60px;
      height: 60px;
      font-size: 26px;
    }
    .station-name { font-size: 16px; }

    .controls { gap: 10px; padding: 2px 0; }
    .control-btn { width: 48px; height: 48px; border-radius: 12px; }
    .play-btn { width: 58px; height: 58px; border-radius: 16px; }
    .control-btn svg, .play-btn svg { width: 22px; height: 22px; }
    .play-btn svg { width: 26px; height: 26px; }

    .favorites-bar { max-height: 110px; }

    .fav-chip { width: calc((100% - 24px) / 4); }
    
    .tab { padding: 8px 4px; font-size: 12px; }
    .big-picture{gap:12px}
    .big-picture-main{column-gap:clamp(20px, 4vw, 36px)}
    .big-picture-art-wrap{width:min(34vh, 22vw, 300px);height:min(34vh, 30vw, 300px);min-width:min(150px, 30vw);min-height:min(150px, 30vh)}
    .big-picture-name{font-size:34px}
    .big-picture-controls{gap:6px}
    .big-picture-controls .control-btn{width:48px;height:48px}
    .big-picture-controls .play-btn{width:62px;height:62px}

    .right-panel.filters-scroll{overflow-y:auto;overscroll-behavior-y:contain}
    .right-panel.filters-scroll .tabs{position:sticky;top:0;z-index:10;background:var(--bg)}
    .right-panel.filters-scroll .stations-container{flex:0 0 auto;overflow:visible;min-height:auto}
  }

  @media(max-width:600px){
    .big-picture-main{grid-template-columns:minmax(0, 1fr);grid-template-rows:minmax(0, 1fr) auto auto;row-gap:10px}
    .big-picture-art-wrap{justify-self:center;width:min(22vh, 50vw, 180px);height:min(22vh, 50vw, 180px);min-width:min(130px, 40vw);min-height:min(130px, 22vh)}
    .big-picture-info{width:100%;max-width:90vw;justify-self:center;text-align:center}
    .big-picture-name{font-size:28px}
    .big-picture-controls{grid-row:auto}
  }
</style>
</head>
<body>
  <div class="app">
    <div class="main-layout">
      <aside class="left-panel">
        <section class="player">
          <div class="station-art-wrap">
            <img id="stationLogo" class="station-art" alt="" onerror="this.style.display='none';document.getElementById('stationLogoFallback').style.display='flex'">
            <div id="stationLogoFallback" class="station-art-fallback" aria-hidden="true"></div>
          </div>

          <div class="station-main">
            <div id="stationName" class="station-name">Wybierz stację</div>
            <div id="stationMeta" class="station-meta">Radio internetowe</div>
            <div id="nowPlaying" class="now-playing">Gotowe do odtwarzania</div>
          </div>

          <div class="player-actions">
            <button id="favoriteCurrent" class="icon-btn" title="Ulubione" aria-label="Ulubione">♡</button>
            <button id="bigPictureBtn" class="icon-btn" title="Tryb Big Picture" aria-label="Otwórz tryb Big Picture">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
            </button>
          </div>
        </section>

        <section class="controls">
          <button id="prevBtn" class="control-btn" title="Poprzednia ulubiona">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button id="playBtn" class="play-btn" title="Odtwórz / Pauza">
            <svg id="playIconSvg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="nextBtn" class="control-btn" title="Następna ulubiona">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
          <button id="stopBtn" class="control-btn" title="Zatrzymaj">
            <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
          </button>
          <button id="randomBtn" class="control-btn shuffle-btn" title="Odtwórz losową stację z bieżącej kategorii" aria-label="Odtwórz losową stację z bieżącej kategorii">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h2.5a5 5 0 0 0 4-2l7-8a5 5 0 0 1 4-2H22M2 6h2.5a5 5 0 0 1 4 2l1 1M14 14l1 1a5 5 0 0 0 4 2H22"/></svg>
          </button>
        </section>

        <div class="favorites-section">
          <div class="favorites-title">ULUBIONE STACJE</div>
          <section id="favoritesBar" class="favorites-bar">
            <!-- Dynamiczne -->
          </section>
        </div>
      </aside>

      <section class="right-panel">
        <nav class="tabs">
          <button class="tab active" data-tab="poland">Polska</button>
          <button class="tab" data-tab="popular">Popularne</button>
          <button class="tab" data-tab="filters">Filtry</button>
          <button class="tab" data-tab="search">Szukaj</button>
          <button id="refreshBtn" class="tab refresh-btn" title="Odśwież aplikację">↻</button>
        </nav>

        <section id="searchPanel" class="search-panel hidden">
          <input id="searchInput" type="search" placeholder="np. RMF, ESKA, rock…" autocomplete="off">
          <button id="searchBtn">Szukaj</button>
        </section>

        <section id="filterPanel" class="filter-panel hidden">
          <div>
            <div class="filter-group-title">Gatunek (Tag):</div>
            <div id="tagFilters" class="filter-options">
              <button class="filter-btn active" data-tag="music">Muzyka</button>
              <button class="filter-btn" data-tag="pop">Pop</button>
              <button class="filter-btn" data-tag="rock">Rock</button>
              <button class="filter-btn" data-tag="hip-hop">Rap / Hip-Hop</button>
              <button class="filter-btn" data-tag="dance">Dance</button>
              <button class="filter-btn" data-tag="jazz">Jazz</button>
              <button class="filter-btn" data-tag="classical">Klasyczna</button>
              <button class="filter-btn" data-tag="alternative">Alternatywna</button>
              <button class="filter-btn" data-tag="ambient">Ambient</button>
              <button class="filter-btn" data-tag="blues">Blues</button>
              <button class="filter-btn" data-tag="chillout">Chillout</button>
              <button class="filter-btn" data-tag="country">Country</button>
              <button class="filter-btn" data-tag="electronic">Elektroniczna</button>
              <button class="filter-btn" data-tag="folk">Folk</button>
              <button class="filter-btn" data-tag="funk">Funk</button>
              <button class="filter-btn" data-tag="house">House</button>
              <button class="filter-btn" data-tag="indie">Indie</button>
              <button class="filter-btn" data-tag="metal">Metal</button>
              <button class="filter-btn" data-tag="news">Wiadomości</button>
              <button class="filter-btn" data-tag="reggae">Reggae</button>
              <button class="filter-btn" data-tag="soul">Soul</button>
              <button class="filter-btn" data-tag="techno">Techno</button>
              <button class="filter-btn" data-tag="trance">Trance</button>
              <button class="filter-btn" data-tag="talk">Talk</button>
              <button class="filter-btn" data-tag="oldies">Oldies</button>
              <button class="filter-btn" data-tag="latin">Latino</button>
            </div>
          </div>
          <div>
            <div class="filter-group-title">Popularność / Sortowanie:</div>
            <div id="popularityFilters" class="filter-options">
              <button class="filter-btn active" data-sort="clickcount" data-reverse="true">Najczęściej słuchane</button>
              <button class="filter-btn" data-sort="votes" data-reverse="true">Najwyżej oceniane</button>
              <button class="filter-btn" data-sort="bitrate" data-reverse="true">Najwyższy bitrate</button>
              <button class="filter-btn" data-sort="name" data-reverse="false">Alfabetycznie (A-Z)</button>
            </div>
          </div>
        </section>

        <section class="stations-head">
          <div id="sectionTitle">Stacje z Polski</div>
          <div id="resultCount">0</div>
        </section>

        <div class="stations-container">
          <section id="stations" class="stations">
            <div class="empty">Ładowanie stacji…</div>
          </section>
        </div>
      </section>
    </div>

    <footer class="footer">
      <span id="streamStatus">Brak odtwarzania</span>
      <span id="connectionStatus">Łączenie z Radio-Browser…</span>
      <span>Radio-Browser</span>
    </footer>

    <audio id="audio" preload="none"></audio>
  </div>

  <section id="bigPicture" class="big-picture hidden" aria-label="Odtwarzacz Big Picture" aria-hidden="true">
    <img id="bigPictureBackdrop" class="big-picture-backdrop hidden" alt="" aria-hidden="true">
    <button id="bigPictureClose" class="icon-btn big-picture-close" title="Zamknij" aria-label="Zamknij tryb Big Picture">×</button>
    <button id="bigPictureRefresh" class="icon-btn big-picture-refresh" title="Odśwież aplikację" aria-label="Odśwież aplikację">↻</button>
    <button id="bigPictureFavorite" class="icon-btn big-picture-favorite" title="Ulubione" aria-label="Dodaj stację do ulubionych">♡</button>
    <div class="big-picture-main">
      <div class="big-picture-art-wrap">
        <img id="bigPictureLogo" class="big-picture-art hidden" alt="Logo stacji">
        <div id="bigPictureLogoFallback" class="big-picture-fallback" aria-hidden="true"></div>
      </div>
      <div class="big-picture-info">
        <div id="bigPictureName" class="big-picture-name">Wybierz stację</div>
        <div id="bigPictureMeta" class="big-picture-meta">Radio internetowe</div>
        <div id="bigPictureStatus" class="big-picture-status">Gotowe do odtwarzania</div>
      </div>
      <div class="big-picture-controls" aria-label="Sterowanie odtwarzaniem">
        <button id="bigPicturePrev" class="control-btn" title="Poprzednia ulubiona" aria-label="Poprzednia ulubiona"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button id="bigPicturePlay" class="play-btn" title="Odtwórz / Pauza" aria-label="Odtwórz / Pauza"><svg id="bigPicturePlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="bigPictureNext" class="control-btn" title="Następna ulubiona" aria-label="Następna ulubiona"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
        <button id="bigPictureStop" class="control-btn" title="Zatrzymaj" aria-label="Zatrzymaj"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
        <button id="bigPictureRandom" class="control-btn shuffle-btn" title="Odtwórz losową stację z bieżącej kategorii" aria-label="Odtwórz losową stację z bieżącej kategorii"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 14 4 4-4 4M18 2l4 4-4 4M2 18h2.5a5 5 0 0 0 4-2l7-8a5 5 0 0 1 4-2H22M2 6h2.5a5 5 0 0 1 4 2l1 1M14 14l1 1a5 5 0 0 0 4 2H22"/></svg></button>
      </div>
    </div>
    <section class="big-picture-favorites" aria-label="Ulubione stacje">
      <div class="big-picture-favorites-title">ULUBIONE STACJE</div>
      <div id="bigPictureFavorites" class="favorites-bar"></div>
    </section>
  </section>

  <script src="app.js"></script>
</body>
</html>
